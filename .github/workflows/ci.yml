# If this file is renamed, the incrementing run attempt number will be reset.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "release" ]
  pull_request:
    branches: [ "dev", "release" ]

env:
  CI_BUILD_NUMBER_BASE: ${{ github.run_number }}
  CI_TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  CI_EVENT: ${{ github.event_name }}

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: build-linux

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v5
        with:
          name: squiflog-x86_64-unknown-linux-musl
          path: ./target/x86_64-unknown-linux-musl/release
      - uses: actions/download-artifact@v5
        with:
          name: squiflog-aarch64-unknown-linux-musl
          path: ./target/aarch64-unknown-linux-musl/release
      - name: Build and Publish
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          ./ci/win-x64/build.ps1

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Build and Publish
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        shell: pwsh
        run: |
          ./ci/linux-x64/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: squiflog-x86_64-unknown-linux-musl
          path: ./target/x86_64-unknown-linux-musl/release/squiflog
      - uses: actions/upload-artifact@v4
        with:
          name: squiflog-aarch64-unknown-linux-musl
          path: ./target/aarch64-unknown-linux-musl/release/squiflog
